name: Build LeakBot OLED Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter project skeleton & overlay LeakBot files
        run: |
          flutter create --org com.example --project-name leakbot_oled_mobile .
          flutter pub get
          flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeakBot-OLED-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
